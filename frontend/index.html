<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ F1 Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏎️ Explorador de Pilotos de F1</h1>
        <p class="subtitle">Descubra pilotos de Fórmula 1</p>

        <div class="pilot-area">
            <img src="" alt="Piloto de Fórmula 1" id="pilotImage">
            <div id="breedName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Piloto aleatório</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="breedInput"
                placeholder="Digite o nome do piloto (ex: max-verstappen)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
